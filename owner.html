<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Toyland GH – Owner</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>Owner panel 🔐</h1><p id="who">Sign in to manage the shop.</p></header>
<div class="wrap" id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import {getFirestore,collection,onSnapshot,doc,setDoc,updateDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
const a0=initializeApp({apiKey:"AIzaSyBjXnvdNSE2UHm8mikS-dj76gQop1Z61yc",authDomain:"toyland-gh.firebaseapp.com",projectId:"toyland-gh",storageBucket:"toyland-gh.firebasestorage.app",messagingSenderId:"936959592382",appId:"1:936959592382:web:fd1ae556febbd05d195bef"});
const db=getFirestore(a0),auth=getAuth(a0);
const DEFAULTS=[["Remote control car",85,"Cars","🚗"],["Racing toy car",25,"Cars","🏎️"],["Toy helicopter",60,"Flying","🚁"],["Balloons (pack)",10,"Party","🎈"],["Christmas tree",120,"Christmas","🎄"],["Santa hat",15,"Christmas","🎅"],["Kids lipstick set",20,"Kids beauty","💄"],["Kids fake nails",15,"Kids beauty","💅"],["Toy gun",30,"Toys","🔫"]].map((a,i)=>({id:"d"+i,name:a[0],price:a[1],cat:a[2],emoji:a[3],img:"",on:true}));
let items=[],orders=[],tab="items",user=null,stop=[];
const app=document.getElementById("app");
function el(t,p,k){const e=document.createElement(t);for(const x in p||{}){if(x==="text")e.textContent=p[x];else if(x==="on")for(const ev in p.on)e.addEventListener(ev,p.on[ev]);else e[x]=p[x]}(k||[]).forEach(c=>{if(c)e.appendChild(c)});return e}
const money=v=>"GH₵ "+(Math.round(v*100)/100).toLocaleString("en-GH");
const uid=()=>"i"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function pic(i){const d=el("div",{className:"pic"});if(i.img){const m=el("img",{alt:i.name});m.src=i.img;d.appendChild(m)}else d.textContent=i.emoji||"🎁";return d}
function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,420/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.75))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function saveItem(i){return setDoc(doc(db,"items",i.id),{name:i.name,price:Number(i.price)||0,cat:i.cat||"Other",emoji:i.emoji||"",img:i.img||"",on:i.on!==false}).catch(()=>alert("Could not save. Check your internet."))}
function loginView(){
app.innerHTML="";document.getElementById("who").textContent="Sign in to manage the shop.";
const e=el("input",{type:"email",placeholder:"Owner email",autocomplete:"username"}),p=el("input",{type:"password",placeholder:"Password",autocomplete:"current-password"}),m=el("p",{className:"note"});
app.appendChild(el("div",{className:"login"},[e,p,el("button",{className:"send",text:"Sign in",on:{click:()=>{m.textContent="";signInWithEmailAndPassword(auth,e.value.trim(),p.value).catch(()=>{m.textContent="Wrong email or password. Try again."})}}}),m]))}
function panel(){
app.innerHTML="";document.getElementById("who").textContent="Signed in as "+user.email;
const t=el("div",{className:"tabs"});[["items","Items"],["orders","Orders & payments"]].forEach(x=>{const b=el("button",{className:"chip",text:x[1],on:{click:()=>{tab=x[0];panel()}}});b.setAttribute("aria-pressed",tab===x[0]);t.appendChild(b)});
app.appendChild(t);tab==="items"?itemsView():ordersView();
app.appendChild(el("p",{},[el("button",{className:"btn ghost",text:"Sign out",on:{click:()=>signOut(auth)}})]))}
function itemsView(){
if(!items.length)app.appendChild(el("button",{className:"btn red",text:"Save the sample items to my shop",on:{click:()=>DEFAULTS.forEach(saveItem)}}));
app.appendChild(el("button",{className:"btn",text:"+ Add new item",style:"margin:10px 0;display:block",on:{click:()=>saveItem({id:uid(),name:"New item",price:0,cat:"Other",emoji:"🎁",on:true})}}));
items.forEach(i=>{
const n=el("input",{value:i.name}),p=el("input",{type:"number",value:i.price,min:0,step:"0.5"}),c=el("input",{value:i.cat}),e=el("input",{value:i.emoji||"",placeholder:"Emoji"});
const go=()=>{i.name=n.value;i.price=p.value;i.cat=c.value;i.emoji=e.value;saveItem(i)};
[n,p,c,e].forEach(x=>x.addEventListener("change",go));
const f=el("input",{type:"file",accept:"image/*",style:"display:none"});
f.addEventListener("change",()=>{if(f.files[0])shrink(f.files[0]).then(d=>{i.img=d;saveItem(i)}).catch(()=>alert("Could not read that photo."))});
app.appendChild(el("div",{className:"card"},[el("div",{className:"row"},[pic(i),el("div",{className:"price",text:money(i.price)})]),el("div",{className:"f"},[n,p,c,e]),f,
el("div",{className:"acts"},[el("button",{className:"btn",text:i.img?"Change photo":"Add real photo",on:{click:()=>f.click()}}),
el("button",{className:"btn ghost",text:i.on===false?"Show in shop":"Hide from shop",on:{click:()=>{i.on=i.on===false;saveItem(i)}}}),
el("button",{className:"btn ghost",text:"Delete",on:{click:()=>{if(confirm("Delete "+i.name+"?"))deleteDoc(doc(db,"items",i.id))}}})])]))})}
function ordersView(){
let paid=0,owed=0,today=0;const d0=new Date();d0.setHours(0,0,0,0);
orders.forEach(o=>{if(o.paid){paid+=o.total;if(o.at>=d0.getTime())today+=o.total}else if(o.status!=="cancelled")owed+=o.total});
const st=(l,v)=>el("div",{className:"stat"},[el("span",{text:l}),el("b",{text:v})]);
app.appendChild(el("div",{className:"stats"},[st("Paid today",money(today)),st("All paid",money(paid)),st("Waiting for payment",money(owed)),st("Orders",String(orders.length))]));
if(!orders.length)app.appendChild(el("p",{text:"No orders yet. New orders will appear here."}));
orders.slice().sort((a,b)=>b.at-a.at).forEach(o=>{
const up=x=>updateDoc(doc(db,"orders",o.id),x);
const m=el("select");["","Mobile Money","Cash","Bank"].forEach(x=>{const op=el("option",{text:x||"Payment method",value:x});if(x===o.method)op.selected=true;m.appendChild(op)});
app.appendChild(el("div",{className:"card"},[
el("div",{className:"row"},[el("b",{text:o.name+(o.phone?" · "+o.phone:"")}),el("span",{className:"tag"+(o.paid?" paid":""),text:o.paid?"Paid":"Not paid"})]),
el("div",{text:(o.lines||[]).map(l=>l.q+" × "+l.n).join(", ")}),
el("div",{className:"row"},[el("span",{text:new Date(o.at).toLocaleString("en-GH")}),el("b",{text:money(o.total)})]),
el("div",{className:"acts"},[m,el("button",{className:"btn",text:o.paid?"Mark not paid":"Mark as paid",on:{click:()=>up({paid:!o.paid,method:m.value})}}),
el("button",{className:"btn ghost",text:o.status==="done"?"Reopen":"Mark delivered",on:{click:()=>up({status:o.status==="done"?"new":"done"})}}),
el("button",{className:"btn ghost",text:"Cancel",on:{click:()=>up({status:"cancelled"})}})]),
el("span",{className:"tag",text:"Status: "+o.status})]))})}
function busy(){const a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="SELECT")}
onAuthStateChanged(auth,u=>{stop.forEach(f=>f());stop=[];user=u;
if(!u){loginView();return}
stop.push(onSnapshot(collection(db,"items"),s=>{items=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(!busy())panel()},()=>{}));
stop.push(onSnapshot(collection(db,"orders"),s=>{orders=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(!busy())panel()},()=>{}));
panel()});
</script></body></html>
