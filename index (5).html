function clampCart(){for(const id in cart){const it=items.find(x=>x.id===id);if(!it||it.on===false){delete cart[id];continue}const m=left(it);if(cart[id]>m)cart[id]=Math.max(0,m);if(!cart[id])delete cart[id]}}
build();
onSnapshot(doc(db,"shop","info"),s=>{const d=s.exists()?s.data():{};SHOP=d;SHOP_PHONE=waNum(d.whatsapp);SHOP_MOMO=d.momo||"";SHOP_MOMO_NAME=d.momoName||"";if(!busyNow())build()},e=>console.error("shop info",e));
onSnapshot(collection(db,"items"),s=>{if(!s.empty){items=s.docs.map(d=>Object.assign({id:d.id},d.data()))}else items=DEFAULTS;clampCart();if(!busyNow())build();else{drawGrid();drawBar()}},e=>console.error("items",e));
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
